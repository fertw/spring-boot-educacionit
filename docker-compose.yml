services:
  mysql:
    image: mysql:8.0
    container_name: alumnos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: alumnos
    ports:
      - "3306:3306"
    volumes:
      - alumnos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: alumnos-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  alumnos_mysql_data:
